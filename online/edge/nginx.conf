# Proxy local do Compose: junta lobby/game/economy numa porta so, igual ao Ingress do
# cluster (online/deploy/helm/*/values.yaml) - /api/lobby e /m vao pro lobby-service,
# /ws pro game-service, /economy pro economy-service. So para dev local; o cluster
# usa Traefik de verdade (k8s-ops).
server {
    listen 8080;

    location /api/lobby/ {
        proxy_pass http://lobby-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /m/ {
        proxy_pass http://lobby-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /ws/ {
        proxy_pass http://game-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /economy/ {
        proxy_pass http://economy-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
