# Rede minima no namespace gtranca: nega tudo por padrao e libera so o necessario.
# Rotulos: lobby/game pelos charts (app.kubernetes.io/name), postgres (app: postgres),
# backup (app: postgres-backup), economy-service futuro (app: economy-service).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-all, namespace: gtranca }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# DNS (kube-system) para todos os pods do namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-dns-egress, namespace: gtranca }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# Traefik (namespace traefik) -> lobby e game na porta do conteiner.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-traefik-to-public, namespace: gtranca }
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [lobby-service, game-service] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: traefik } }
      ports:
        - { protocol: TCP, port: 8080 }
---
# game <-> lobby (rotas /internal pelo nome do Service). Entrada:
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-lobby-game-ingress, namespace: gtranca }
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [lobby-service, game-service] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [lobby-service, game-service] }
      ports:
        - { protocol: TCP, port: 8080 }
---
# game <-> lobby. Saida:
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-lobby-game-egress, namespace: gtranca }
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [lobby-service, game-service] }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [lobby-service, game-service] }
      ports:
        - { protocol: TCP, port: 8080 }
---
# Postgres: entrada so do economy-service (futuro) e do backup.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-postgres-clients, namespace: gtranca }
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: economy-service } }
        - podSelector: { matchLabels: { app: postgres-backup } }
      ports:
        - { protocol: TCP, port: 5432 }
---
# Saida para o Postgres dos mesmos clientes.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-egress-to-postgres, namespace: gtranca }
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [economy-service, postgres-backup] }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { app: postgres } }
      ports:
        - { protocol: TCP, port: 5432 }
