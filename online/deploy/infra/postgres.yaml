# PostgreSQL oficial, auto-hospedado. Comum ao cluster local e a nuvem.
# Credenciais no Secret postgres-credentials, criado no cluster (nunca no repositorio); ver online/deploy/README.md.
# O volume (PVC postgres-data) vem do arquivo do ambiente: local/postgres-storage.yaml ou cloud/postgres-storage.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: gtranca
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: gtranca
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: gtranca
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 999          # usuario postgres da imagem oficial; dono do diretorio de dados
        runAsGroup: 999
        fsGroup: 999            # vale em volumes dinamicos (nuvem); hostPath ignora (diretorio criado ja com dono 999)
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:17.11
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef: { name: postgres-credentials }
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          startupProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""] }
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }   # socket e pid (raiz somente leitura)
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
