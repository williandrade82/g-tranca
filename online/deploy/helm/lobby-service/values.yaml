image:
  repository: gtranca/lobby-service
  tag: "e80cc18"   # hash do commit da imagem; nunca latest/dev (troque com --set image.tag=...)
  pullPolicy: IfNotPresent   # imagem local, sem registro externo

replicaCount: 1
terminationGracePeriodSeconds: 30
containerPort: 8080

# Configuracao por variaveis de ambiente (nada fixo em codigo)
env:
  PORT: "8080"
  ECONOMY_URL: "http://economy-service"   # Service do economy (porta 80, nao a do conteiner)
  TRUST_FORWARDED_FOR: "true"      # atras do Traefik: usa o IP real do cliente no limite de taxa
  TABLE_OPEN_TTL_MINUTES: "30"     # mesa aberta sem atividade expira
  # Docker Desktop (Windows) troca o IP de origem: todos os celulares chegam como o mesmo IP interno (172.19.0.x), entao o
  # limite "por IP" vale para TODOS juntos. No cluster local ele fica alto; quem separa os jogadores e o limite por token
  # (120/min). Num cluster com o IP real preservado, voltar a 120 e 10.
  RATE_LIMIT_PER_MINUTE: "2000"
  GUEST_CREATION_PER_MINUTE: "200"
  GAME_SERVICE_URL: "http://game-service"   # nome do Service do game-service (rede interna)
  # Login Google (etapa 2.6, §18.1): client_id OAuth tipo "Web" do projeto Google Cloud do app (publico, vai no
  # ID token como "aud"; nao e segredo, por isso fica aqui e nao em Secret). GOOGLE_JWKS_URL tem padrao no codigo
  # (https://www.googleapis.com/oauth2/v3/certs); so troque se precisar. Sem GOOGLE_CLIENT_ID o login fica desligado.
  GOOGLE_CLIENT_ID: "765029986627-a6s73siqbj8a812rpdo5frv1lvffhn3b.apps.googleusercontent.com"

# Segredo servico a servico (INTERNAL_SECRET): Secret criado no cluster, nunca em values (ver online/deploy/README.md).
internalSecret:
  name: gtranca-internal
  key: INTERNAL_SECRET

# Postgres (etapa 2.4): host/porta aqui; usuario, senha e banco vem do Secret postgres-credentials (o mesmo do economy).
# O lobby usa o schema `lobby` (criado pelo Flyway dele; o usuario do banco e dono do banco, entao pode criar schema).
database:
  host: postgres
  port: 5432
  secret: postgres-credentials   # chaves POSTGRES_DB, POSTGRES_USER, POSTGRES_PASSWORD

waitForPostgres:
  image: postgres:17.11   # mesma imagem do StatefulSet (ja local); so usa pg_isready

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: traefik
  host: ""        # vazio = qualquer host (acesso por http://192.168.1.5)
  paths: [/m, /api/lobby]   # o resto (/health, /info) continua no game-service

resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 512Mi }

# Chave do aplicativo (APP_SIGNING_KEY, §18.2 "So o aplicativo oficial"): Secret criado no cluster, a mesma que vai no
# build do app (local.properties). Sem o Secret o servico sobe SEM verificar a assinatura (aviso no log).
appKey:
  name: gtranca-app-key
  key: APP_SIGNING_KEY
