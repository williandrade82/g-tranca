image:
  repository: gtranca/game-service
  tag: dev
  pullPolicy: IfNotPresent   # imagem local, sem registro externo

replicaCount: 1
containerPort: 8080

# Configuracao por variaveis de ambiente (nada fixo em codigo)
env:
  PORT: "8080"
  JAVA_OPTS: "-XX:MaxRAMPercentage=65"   # heap = 65% do limite do conteiner

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: traefik
  host: ""        # vazio = qualquer host (acesso por http://192.168.1.5)
  path: /

resources:
  # O motor + robos usam CPU (o Dificil faz busca por decisao); 2 CPUs de teto, memoria 768Mi.
  requests: { cpu: 500m, memory: 384Mi }
  limits: { cpu: "2", memory: 768Mi }
