# Console de gerenciamento (Sec18.7): SPA servida estatica + proxy same-origin para o admin-api, para o
# navegador nunca precisar de CORS (ver online/admin-api/Main.kt, comentario sobre same-origin/CSRF).
# "admin-api" e o nome do servico na rede do Docker Compose (online/docker-compose.yml); se este arquivo
# for reaproveitado num Helm chart (k8s-ops), o nome do Service la precisa ser o mesmo, ou este endereco
# muda para variavel de ambiente resolvida no arranque do container (nao fiz isso aqui: fora do escopo
# desta etapa, que e so o Compose de desenvolvimento).
#
# "resolver 127.0.0.11" (DNS interno do Docker) + "$admin_api" numa variavel: forca o nginx a resolver
# "admin-api" de novo a cada pedido (respeitando o "valid=10s"), em vez de resolver uma unica vez no
# arranque do worker e guardar o IP pra sempre (pegadinha conhecida de nginx + Docker Compose: um
# proxy_pass com host literal so resolve no arranque). Sem isso, recriar SO o admin-api (ex.:
# "docker compose up --build admin-api", sem reconstruir o admin-web) deixa o admin-web com o IP velho e
# /admin/* devolvendo 502 depois que o IP mudasse. Confirmado na pratica: parei o admin-api, ocupei o IP
# dele com um container qualquer (pra forcar um IP diferente na volta), religuei o admin-api e, SEM
# reiniciar o admin-web, o login pela porta 8085 continuou funcionando — so por causa do resolver+variavel
# acima; com "proxy_pass http://admin-api:8080;" (host literal) isso teria dado 502.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabecalhos de seguranca (docs/telas-admin-web.md: console separado do app, acesso restrito).
    # Sem 'unsafe-inline': o bundle do Vite nao precisa de script/style inline.
    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # index.html nunca em cache (ele referencia os bundles com hash; sem isso o navegador poderia
    # servir uma versao velha do HTML apontando pra um JS que nao existe mais apos o deploy seguinte).
    # Os 4 add_header de novo aqui NAO sao redundancia: o nginx so herda add_header do bloco pai quando o
    # bloco filho NAO declara nenhum (pegadinha classica); como este bloco ja tem o Cache-Control, teria
    # perdido CSP/nosniff/X-Frame-Options/Referrer-Policy sem repetir (visto na pratica: curl -I /
    # devolvia so Cache-Control, sem os outros 4, antes desta correcao).
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # Mesmo caminho relativo que o cliente usa em dev (vite.config.ts "server.proxy"): /admin/* vai pro
    # admin-api, nunca pro navegador achar que e uma rota da SPA.
    location /admin/ {
        set $admin_api admin-api:8080;
        # Sem caminho depois de $admin_api: com proxy_pass usando variavel, o nginx NAO faz a troca
        # automatica do prefixo da location (so faz isso com host literal) - passar um "/admin/" aqui
        # mandava sempre "POST /admin/" pro admin-api, nunca "/admin/login" (visto na pratica: log de
        # acesso do admin-api so registrava "/admin/", nunca o caminho completo). Sem caminho nenhum,
        # o nginx repassa o URI original (com "/admin/login" e tudo) sem reescrever.
        proxy_pass http://$admin_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback de SPA: qualquer outra rota (ex. recarregar a pagina em /painel) devolve o index.html,
    # e o react-router decide o que mostrar no navegador.
    location / {
        try_files $uri /index.html;
    }
}
